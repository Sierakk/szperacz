<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Szperacz</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/szperacz.svg" alt="" width="24" height="24">
    <h1>Szperacz</h1>
    <span id="status" class="muted"></span>
    <label class="switch">
      <input type="checkbox" id="enabled" role="switch" aria-label="Włącz filtrowanie">
      <span class="track"><span class="thumb"></span></span>
    </label>
  </header>

  <p id="summary" class="muted" aria-live="polite"></p>

  <main id="main">
    <section>
      <div class="section-head">
        <h2>Widoczne kategorie</h2>
        <span id="count" class="muted"></span>
        <button type="button" id="all" class="ghost" aria-label="Pokaż wszystkie kategorie">Wszystkie</button>
        <button type="button" id="none" class="ghost" aria-label="Ukryj wszystkie kategorie">Żadne</button>
      </div>
      <ul id="categories"></ul>
    </section>

    <div class="card">
      <label class="row option">
        <span class="text">
          <span class="title">Ukryj etykiety „Wyróżnione”</span>
          <span class="muted">Inaczej zostają w pustych miejscach.</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="hideBadges" role="switch" aria-label="Ukryj etykiety Wyróżnione">
          <span class="track"><span class="thumb"></span></span>
        </span>
      </label>
      <label class="row option">
        <span class="text">
          <span class="title">Licznik ukrytych ogłoszeń</span>
          <span class="muted">Klik w plakietkę rozwija kategorie.</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="showCounter" role="switch" aria-label="Pokaż licznik ukrytych ogłoszeń">
          <span class="track"><span class="thumb"></span></span>
        </span>
      </label>
    </div>
  </main>

  <script src="../categories.js"></script>
  <script src="popup.js"></script>
</body>
</html>
